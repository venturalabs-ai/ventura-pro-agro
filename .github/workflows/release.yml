name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SemVer tag and project version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(python - <<'PY'
          import tomllib
          with open('backend/pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match project version $VERSION" >&2; exit 1; }
      - name: Install and validate release
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check app tests
          pytest -q --cov=app --cov-branch --cov-fail-under=60
          pip-audit
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Package source and checksums
        shell: bash
        run: |
          tar --exclude=.git -czf "ventura-pro-agro-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "ventura-pro-agro-${GITHUB_REF_NAME}.tar.gz" sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ventura-pro-agro-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
