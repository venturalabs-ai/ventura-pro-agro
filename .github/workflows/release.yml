name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Validate SemVer tag and project version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          VERSION=$(python - <<'PY'
          import tomllib
          with open('backend/pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG does not match project version $VERSION" >&2; exit 1; }
      - name: Install and validate release
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check app tests
          pytest -q --cov=app --cov-branch --cov-fail-under=80
          bandit -q -r app -ll
          pip-audit
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Package source and checksums
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "ventura-pro-agro-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "ventura-pro-agro-${GITHUB_REF_NAME}.tar.gz" sbom.spdx.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ventura-pro-agro-${{ github.ref_name }}.tar.gz
            sbom.spdx.json
            SHA256SUMS
